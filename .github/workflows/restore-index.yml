name: Restore index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp post-everywhere-public-page.html index.html
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Publish index" || echo "no change"
          git push
